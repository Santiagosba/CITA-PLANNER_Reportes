<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b63d6" />
    <title>AVI CRM · Cita Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Paleta legacy (`--accent-*`) para compatibilidad con branding dinámico -->
    <style>
      :root {
        --accent-50: #eff6ff;
        --accent-100: #dbeafe;
        --accent-200: #bfdbfe;
        --accent-300: #93c5fd;
        --accent-400: #60a5fa;
        --accent-500: #3b82f6;
        --accent-600: #2563eb;
        --accent-700: #1d4ed8;
        --accent-800: #1e40af;
        --accent-900: #1e3a8a;
        --accent-950: #172554;
        --brand-primary: #0b63d6;
        --brand-accent: #60a5fa;
      }
      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .custom-scrollbar-light {
        scrollbar-width: thin;
        scrollbar-color: rgba(100, 116, 139, 0.45) transparent;
      }
      .custom-scrollbar-light::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar-light::-webkit-scrollbar-thumb {
        background-color: rgba(100, 116, 139, 0.45);
        border-radius: 999px;
      }
      .custom-scrollbar-light::-webkit-scrollbar-track {
        background: transparent;
      }
      html.dark .custom-scrollbar-light {
        scrollbar-color: rgba(148, 163, 184, 0.35) transparent;
      }
      html.dark .custom-scrollbar-light::-webkit-scrollbar-thumb {
        background-color: rgba(148, 163, 184, 0.35);
      }
      @keyframes insight-shine {
        0%,
        100% {
          opacity: 0.12;
          transform: scale(1) rotate(-6deg);
        }
        50% {
          opacity: 0.22;
          transform: scale(1.05) rotate(0deg);
        }
      }
      .animate-insight-shine {
        animation: insight-shine 5s ease-in-out infinite;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fade-in-down {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out;
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.4s ease-out;
      }
      .animate-fade-in-down {
        animation: fade-in-down 0.4s ease-out;
      }
      .text-app-accent {
        color: var(--color-brand, #0b63d6);
      }
    </style>
  </head>
  <body class="m-0 min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
